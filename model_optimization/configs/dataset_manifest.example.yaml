# Copy this file to configs/dataset_manifest.yaml and edit paths on the cloud VM.
# All annotation files must be COCO-format JSON. COCO, Objects365, LVIS and many
# Open Images exports can be handled through this common format.

output_root: /data/obstacle8_gray

sources:
  - name: coco_train
    split: train
    images: /data/coco/train2017
    annotations: /data/coco/annotations/instances_train2017.json
    prefix: coco_train_
    limit: 0

  - name: coco_val
    split: val
    images: /data/coco/val2017
    annotations: /data/coco/annotations/instances_val2017.json
    prefix: coco_val_
    limit: 0

  # Add more public datasets after converting/exporting annotations to COCO JSON.
