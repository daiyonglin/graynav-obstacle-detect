model:
  imgsz: 384
  project: runs/detect
  name_prefix: graystem_bc_yolov8n80
  workers: 12
  patience: 14

stages:
  warmup:
    epochs: 2
    freeze: 10
    lr0: 0.00008
    lrf: 0.1
    hsv_v: 0.08
    degrees: 0.5
    translate: 0.03
    scale: 0.20
    perspective: 0.0
    erasing: 0.04
    mosaic: 0.0
    close_mosaic: 0
    warmup_epochs: 1.0
  adapt:
    epochs: 18
    freeze: 0
    lr0: 0.00005
    lrf: 0.1
    hsv_v: 0.10
    degrees: 0.8
    translate: 0.04
    scale: 0.25
    perspective: 0.0002
    erasing: 0.06
    mosaic: 0.05
    close_mosaic: 6
    warmup_epochs: 1.5
  stabilize:
    epochs: 6
    freeze: 0
    lr0: 0.000015
    lrf: 0.2
    hsv_v: 0.03
    degrees: 0.0
    translate: 0.01
    scale: 0.10
    perspective: 0.0
    erasing: 0.0
    mosaic: 0.0
    close_mosaic: 0
    warmup_epochs: 1.0
