model:
  base_weights: yolov8n.pt
  imgsz: 384
  project: runs/detect
  name_prefix: obstacle8_gray_yolov8n
  workers: 12
  patience: 25

stages:
  warmup:
    epochs: 20
    freeze: 10
    lr0: 0.003
    lrf: 0.20
    mosaic: 0.20
    mixup: 0.00
    hsv_v: 0.20
    close_mosaic: 5

  adapt:
    epochs: 90
    freeze: 0
    lr0: 0.002
    lrf: 0.12
    mosaic: 0.35
    mixup: 0.05
    hsv_v: 0.30
    close_mosaic: 15

  stabilize:
    epochs: 35
    freeze: 0
    lr0: 0.0008
    lrf: 0.08
    mosaic: 0.00
    mixup: 0.00
    hsv_v: 0.18
    close_mosaic: 0

