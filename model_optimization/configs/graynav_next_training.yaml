model:
  base_weights: /root/autodl-tmp/yolov8n.pt
  imgsz: 384
  project: runs/detect
  name_prefix: graynav_next
  workers: 8
  patience: 30

stages:
  warmup:
    epochs: 10
    freeze: 10
    lr0: 0.0025
    lrf: 0.25
    mosaic: 0.20
    mixup: 0.00
    hsv_v: 0.20
    close_mosaic: 3

  adapt:
    epochs: 80
    freeze: 0
    lr0: 0.0015
    lrf: 0.12
    mosaic: 0.35
    mixup: 0.03
    hsv_v: 0.25
    close_mosaic: 15

  stabilize:
    epochs: 30
    freeze: 0
    lr0: 0.0005
    lrf: 0.08
    mosaic: 0.00
    mixup: 0.00
    hsv_v: 0.15
    close_mosaic: 0
