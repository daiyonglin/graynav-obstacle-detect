model:
  imgsz: 384
  project: runs/detect
  name_prefix: graystem_smoke
  workers: 4
  patience: 3

stages:
  warmup:
    epochs: 1
    freeze: 10
    lr0: 0.001
    lrf: 0.1
    hsv_v: 0.20
    mosaic: 0.0
    mixup: 0.0
    close_mosaic: 0
  adapt:
    epochs: 1
    freeze: 0
    lr0: 0.0005
    lrf: 0.1
    hsv_v: 0.20
    mosaic: 0.0
    mixup: 0.0
    close_mosaic: 0
  stabilize:
    epochs: 1
    freeze: 0
    lr0: 0.0001
    lrf: 0.1
    hsv_v: 0.10
    mosaic: 0.0
    mixup: 0.0
    close_mosaic: 0

