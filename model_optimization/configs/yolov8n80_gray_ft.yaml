model:
  imgsz: 384
  project: runs/detect
  name_prefix: yolov8n80_gray_ft
  workers: 12
  patience: 20

stages:
  warmup:
    epochs: 5
    freeze: 10
    lr0: 0.0002
    lrf: 0.1
    hsv_v: 0.18
    mosaic: 0.15
    mixup: 0.0
    close_mosaic: 2
  adapt:
    epochs: 45
    freeze: 0
    lr0: 0.00012
    lrf: 0.05
    hsv_v: 0.22
    mosaic: 0.30
    mixup: 0.0
    close_mosaic: 10
  stabilize:
    epochs: 10
    freeze: 0
    lr0: 0.00003
    lrf: 0.2
    hsv_v: 0.08
    mosaic: 0.0
    mixup: 0.0
    close_mosaic: 0

