<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-labelledby="title desc">
  <title id="title">GrayNav embedded assistive navigation system</title>
  <desc id="desc">Research-style end-to-end system architecture from monochrome image capture to stable obstacle-avoidance guidance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#26384a"/>
    </marker>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102a43" flood-opacity="0.13"/>
    </filter>
    <style>
      .title{font:800 52px Arial,Helvetica,sans-serif;fill:#102a43}
      .subtitle{font:700 26px Arial,Helvetica,sans-serif;fill:#52667a}
      .section{font:800 25px Arial,Helvetica,sans-serif;fill:#334e68;letter-spacing:.8px}
      .head{font:800 29px Arial,Helvetica,sans-serif;fill:#102a43}
      .body{font:700 22px Arial,Helvetica,sans-serif;fill:#334e68}
      .small{font:700 20px Arial,Helvetica,sans-serif;fill:#627d98}
      .mono{font:700 21px 'Courier New',monospace;fill:#0b5f8a}
      .panel{fill:#fbfdff;stroke:#9fb3c8;stroke-width:2;stroke-dasharray:10 8;rx:18}
      .box{stroke-width:2.2;rx:16;filter:url(#shadow)}
      .arrow{fill:none;stroke:#26384a;stroke-width:4;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#26384a;stroke-width:4}
      .tag{fill:#eef4f8;stroke:#bcccdc;stroke-width:1.7;rx:11}
    </style>
  </defs>

  <rect width="1900" height="1080" fill="#ffffff"/>
  <text x="950" y="58" text-anchor="middle" class="title">GrayNav Embedded Assistive Navigation System</text>
  <text x="950" y="96" text-anchor="middle" class="subtitle">Mono sensing · one-model inference · uncertainty-aware fusion · synchronized guidance</text>

  <!-- Stage 1 -->
  <rect x="40" y="145" width="280" height="650" class="panel"/>
  <text x="65" y="182" class="section">1 · SENSING</text>
  <rect x="75" y="225" width="210" height="135" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="180" y="268" text-anchor="middle" class="head">SC132GS</text>
  <text x="180" y="308" text-anchor="middle" class="body">Y8 video stream</text>
  <text x="180" y="338" text-anchor="middle" class="mono">720×1280 @ 90 fps</text>
  <rect x="75" y="420" width="210" height="145" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="180" y="463" text-anchor="middle" class="head">Frame health</text>
  <text x="180" y="503" text-anchor="middle" class="body">black-cover · freeze</text>
  <text x="180" y="537" text-anchor="middle" class="body">capture · resource</text>
  <rect x="75" y="625" width="210" height="115" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="180" y="668" text-anchor="middle" class="head">ROI scheduler</text>
  <text x="180" y="708" text-anchor="middle" class="mono">LOWER · UPPER</text>
  <path d="M180 360 V420" class="arrow"/>
  <path d="M180 565 V625" class="arrow"/>

  <!-- Stage 2 -->
  <rect x="365" y="145" width="285" height="650" class="panel"/>
  <text x="390" y="182" class="section">2 · NPU INFERENCE</text>
  <rect x="405" y="255" width="205" height="300" class="box" fill="#e7f7f2" stroke="#3a9d83"/>
  <text x="508" y="302" text-anchor="middle" class="head">Unified INT8</text>
  <text x="508" y="342" text-anchor="middle" class="head">Perception</text>
  <text x="508" y="397" text-anchor="middle" class="body">Indoor8 objects</text>
  <text x="508" y="435" text-anchor="middle" class="body">surface semantics</text>
  <text x="508" y="473" text-anchor="middle" class="body">ordinal depth</text>
  <text x="508" y="520" text-anchor="middle" class="mono">1 model_id · 7 outputs</text>
  <rect x="405" y="625" width="205" height="115" class="box" fill="#e7f7f2" stroke="#3a9d83"/>
  <text x="508" y="668" text-anchor="middle" class="head">Contract guard</text>
  <text x="508" y="708" text-anchor="middle" class="body">shape · dtype · scale</text>
  <path d="M285 682 H340 V405 H405" class="arrow"/>
  <path d="M508 555 V625" class="arrow"/>

  <!-- Stage 3 -->
  <rect x="695" y="145" width="385" height="650" class="panel"/>
  <text x="720" y="182" class="section">3 · CPU EVIDENCE FUSION</text>
  <rect x="735" y="225" width="305" height="160" class="box" fill="#f2eafb" stroke="#8b62aa"/>
  <text x="888" y="268" text-anchor="middle" class="head">Object decoding</text>
  <text x="888" y="309" text-anchor="middle" class="body">sigmoid · DFL · decode · NMS</text>
  <text x="888" y="346" text-anchor="middle" class="body">tracking · class stabilization</text>
  <rect x="735" y="445" width="305" height="160" class="box" fill="#fcefe5" stroke="#d56f2a"/>
  <text x="888" y="488" text-anchor="middle" class="head">Scene decoding</text>
  <text x="888" y="529" text-anchor="middle" class="body">surface filtering · relative depth</text>
  <text x="888" y="566" text-anchor="middle" class="body">gated structural-risk evidence</text>
  <rect x="735" y="665" width="305" height="75" class="box" fill="#fff7df" stroke="#d9a514"/>
  <text x="888" y="711" text-anchor="middle" class="head">Range fusion</text>
  <path d="M1040 305 H1060 V702 H1040" class="arrow"/>
  <path d="M888 605 V665" class="arrow"/>
  <circle cx="675" cy="682" r="7" fill="#26384a"/>
  <path d="M610 682 H675" class="branch"/>
  <path d="M675 682 V305 H735" class="arrow"/>
  <path d="M675 682 V525 H735" class="arrow"/>

  <!-- Stage 4 -->
  <rect x="1125" y="145" width="335" height="650" class="panel"/>
  <text x="1150" y="182" class="section">4 · NAVIGATION</text>
  <rect x="1165" y="235" width="255" height="190" class="box" fill="#fff7df" stroke="#d9a514"/>
  <text x="1293" y="278" text-anchor="middle" class="head">Three-zone planner</text>
  <text x="1293" y="320" text-anchor="middle" class="body">LEFT · CENTER · RIGHT</text>
  <text x="1293" y="358" text-anchor="middle" class="body">distance + occupancy</text>
  <text x="1293" y="394" text-anchor="middle" class="mono">AvoidanceDecision</text>
  <rect x="1165" y="500" width="255" height="175" class="box" fill="#fff7df" stroke="#d9a514"/>
  <text x="1293" y="543" text-anchor="middle" class="head">Guidance stabilizer</text>
  <text x="1293" y="584" text-anchor="middle" class="body">range voting · hysteresis</text>
  <text x="1293" y="621" text-anchor="middle" class="body">direction confirmation</text>
  <text x="1293" y="654" text-anchor="middle" class="mono">StableGuidance</text>
  <path d="M1040 702 H1102 V330 H1165" class="arrow"/>
  <path d="M1293 425 V500" class="arrow"/>

  <!-- Stage 5 -->
  <rect x="1505" y="145" width="350" height="650" class="panel"/>
  <text x="1530" y="182" class="section">5 · GUIDANCE OUTPUTS</text>
  <circle cx="1483" cy="405" r="7" fill="#26384a"/>
  <path d="M1420 588 H1483" class="branch"/>
  <path d="M1483 285 V695" class="branch"/>

  <rect x="1545" y="220" width="270" height="130" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="1680" y="263" text-anchor="middle" class="head">Aurora OSD</text>
  <text x="1680" y="304" text-anchor="middle" class="body">action · range · direction</text>
  <rect x="1545" y="425" width="270" height="130" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="1680" y="468" text-anchor="middle" class="head">Navigation serial</text>
  <text x="1680" y="509" text-anchor="middle" class="body">objects · distance · zones</text>
  <rect x="1545" y="630" width="270" height="130" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="1680" y="673" text-anchor="middle" class="head">SYN6288 voice</text>
  <text x="1680" y="714" text-anchor="middle" class="body">straight · slow · stop · turn</text>
  <path d="M1483 285 H1545" class="arrow"/>
  <path d="M1483 490 H1545" class="arrow"/>
  <path d="M1483 695 H1545" class="arrow"/>

  <!-- Global safety rail -->
  <rect x="40" y="850" width="1815" height="140" class="box" fill="#f3f6f8" stroke="#7b8794"/>
  <text x="90" y="902" class="head">Safety supervisor</text>
  <text x="90" y="946" class="body">Camera, model, resource, and UART faults are isolated from the inference loop and mapped to one consistent SYSTEM_FAULT state.</text>
  <rect x="1450" y="888" width="330" height="58" class="tag"/>
  <text x="1615" y="925" text-anchor="middle" class="mono">CLEAR · SLOW · STOP · LEFT · RIGHT</text>

  <text x="950" y="1040" text-anchor="middle" class="subtitle">All presentation channels consume the same temporally stabilized navigation decision</text>
</svg>
