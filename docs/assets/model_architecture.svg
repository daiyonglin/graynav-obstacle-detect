<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-labelledby="title desc">
  <title id="title">GrayNav unified monocular perception network</title>
  <desc id="desc">Research-style architecture of the single-channel GrayNav network with a shared encoder, multi-scale detection head, and packed scene-depth head.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#26384a"/>
    </marker>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#102a43" flood-opacity="0.13"/>
    </filter>
    <style>
      .title{font:800 52px Arial,Helvetica,sans-serif;fill:#102a43}
      .subtitle{font:700 26px Arial,Helvetica,sans-serif;fill:#52667a}
      .section{font:800 25px Arial,Helvetica,sans-serif;fill:#334e68;letter-spacing:1px}
      .head{font:800 29px Arial,Helvetica,sans-serif;fill:#102a43}
      .body{font:700 22px Arial,Helvetica,sans-serif;fill:#334e68}
      .small{font:700 19px Arial,Helvetica,sans-serif;fill:#627d98}
      .mono{font:700 21px 'Courier New',monospace;fill:#0b5f8a}
      .panel{fill:#fbfdff;stroke:#9fb3c8;stroke-width:2;stroke-dasharray:10 8;rx:18}
      .box{stroke-width:2.2;rx:16;filter:url(#shadow)}
      .arrow{fill:none;stroke:#26384a;stroke-width:4;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#26384a;stroke-width:4}
      .pill{fill:#eef4f8;stroke:#bcccdc;stroke-width:1.8;rx:12}
    </style>
  </defs>

  <rect width="1900" height="1080" fill="#ffffff"/>
  <text x="950" y="58" text-anchor="middle" class="title">GrayNav Unified Monocular Perception Network</text>
  <text x="950" y="96" text-anchor="middle" class="subtitle">True-mono input · shared representation · multi-task evidence · one A1 INT8 model</text>

  <rect x="45" y="140" width="250" height="560" class="panel"/>
  <text x="70" y="177" class="section">INPUT</text>
  <rect x="78" y="235" width="184" height="150" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="170" y="278" text-anchor="middle" class="head">SC132GS</text>
  <text x="170" y="316" text-anchor="middle" class="body">Y8 grayscale</text>
  <text x="170" y="353" text-anchor="middle" class="mono">720 × 1280</text>
  <rect x="78" y="465" width="184" height="150" class="box" fill="#e8f3fb" stroke="#4f9bc6"/>
  <text x="170" y="508" text-anchor="middle" class="head">Mono tensor</text>
  <text x="170" y="546" text-anchor="middle" class="body">ROI + resize</text>
  <text x="170" y="583" text-anchor="middle" class="mono">1×1×384×384</text>
  <path d="M170 385 V465" class="arrow"/>

  <rect x="340" y="140" width="270" height="560" class="panel"/>
  <text x="365" y="177" class="section">MONO STEM</text>
  <rect x="378" y="270" width="194" height="210" class="box" fill="#e7f7f2" stroke="#3a9d83"/>
  <text x="475" y="316" text-anchor="middle" class="head">Gray stem</text>
  <text x="475" y="357" text-anchor="middle" class="body">Conv 3×3 / 2</text>
  <text x="475" y="397" text-anchor="middle" class="body">BN + SiLU</text>
  <text x="475" y="439" text-anchor="middle" class="small">W<tspan baseline-shift="sub">gray</tspan> = W<tspan baseline-shift="sub">R</tspan> + W<tspan baseline-shift="sub">G</tspan> + W<tspan baseline-shift="sub">B</tspan></text>

  <rect x="655" y="140" width="310" height="560" class="panel"/>
  <text x="680" y="177" class="section">SHARED ENCODER</text>
  <rect x="695" y="235" width="230" height="300" class="box" fill="#e7f7f2" stroke="#3a9d83"/>
  <text x="810" y="282" text-anchor="middle" class="head">YOLOv8n</text>
  <text x="810" y="324" text-anchor="middle" class="head">Backbone</text>
  <text x="810" y="372" text-anchor="middle" class="body">Conv + C2f stages</text>
  <text x="810" y="412" text-anchor="middle" class="body">SPPF context</text>
  <text x="810" y="462" text-anchor="middle" class="mono">stride 8 / 16 / 32</text>
  <text x="810" y="501" text-anchor="middle" class="small">COCO transfer initialization</text>

  <rect x="1010" y="140" width="270" height="560" class="panel"/>
  <text x="1035" y="177" class="section">FEATURE PYRAMID</text>
  <rect x="1048" y="235" width="194" height="330" class="box" fill="#fff7df" stroke="#d9a514"/>
  <text x="1145" y="282" text-anchor="middle" class="head">PAN / FPN</text>
  <text x="1145" y="326" text-anchor="middle" class="body">top-down fusion</text>
  <text x="1145" y="364" text-anchor="middle" class="body">bottom-up fusion</text>
  <rect x="1070" y="405" width="150" height="42" class="pill"/>
  <text x="1145" y="433" text-anchor="middle" class="mono">P3 · 48×48</text>
  <rect x="1070" y="462" width="150" height="42" class="pill"/>
  <text x="1145" y="490" text-anchor="middle" class="mono">P4 · 24×24</text>
  <rect x="1070" y="519" width="150" height="42" class="pill"/>
  <text x="1145" y="547" text-anchor="middle" class="mono">P5 · 12×12</text>

  <path d="M262 540 H318 V375 H378" class="arrow"/>
  <path d="M572 375 H655" class="arrow"/>
  <path d="M925 375 H1010" class="arrow"/>

  <rect x="1335" y="140" width="520" height="560" class="panel"/>
  <text x="1360" y="177" class="section">TASK HEADS &amp; STATIC OUTPUTS</text>
  <circle cx="1310" cy="375" r="7" fill="#26384a"/>
  <path d="M1280 375 H1310" class="branch"/>
  <path d="M1310 375 V280 H1375" class="arrow"/>
  <path d="M1310 375 V555 H1375" class="arrow"/>

  <rect x="1375" y="205" width="440" height="195" class="box" fill="#f2eafb" stroke="#8b62aa"/>
  <text x="1595" y="249" text-anchor="middle" class="head">Indoor8 detection</text>
  <text x="1595" y="291" text-anchor="middle" class="body">classification + DFL regression</text>
  <text x="1595" y="333" text-anchor="middle" class="mono">cls/reg @ P3 · P4 · P5</text>
  <text x="1595" y="371" text-anchor="middle" class="small">6 raw tensors · CPU decode and NMS</text>

  <rect x="1375" y="470" width="440" height="195" class="box" fill="#fcefe5" stroke="#d56f2a"/>
  <text x="1595" y="514" text-anchor="middle" class="head">Scene-depth fusion</text>
  <text x="1595" y="556" text-anchor="middle" class="body">P3 detail + resized P4 semantics</text>
  <text x="1595" y="598" text-anchor="middle" class="mono">4 surface + 16 depth + 1 edge</text>
  <text x="1595" y="636" text-anchor="middle" class="small">scene_logits · 1×21×48×48</text>

  <rect x="45" y="750" width="1810" height="235" class="panel"/>
  <text x="70" y="790" class="section">OUTPUT CONTRACT AND DEPLOYMENT SEMANTICS</text>

  <rect x="80" y="830" width="520" height="110" class="box" fill="#f2eafb" stroke="#8b62aa"/>
  <text x="340" y="871" text-anchor="middle" class="head">Object evidence</text>
  <text x="340" y="910" text-anchor="middle" class="body">person · chair · table · bag · couch · bench</text>

  <rect x="690" y="830" width="520" height="110" class="box" fill="#fcefe5" stroke="#d56f2a"/>
  <text x="950" y="871" text-anchor="middle" class="head">Scene evidence</text>
  <text x="950" y="910" text-anchor="middle" class="body">traversable · blocked · structural risk · unknown</text>

  <rect x="1300" y="830" width="520" height="110" class="box" fill="#eaf2f8" stroke="#4f9bc6"/>
  <text x="1560" y="871" text-anchor="middle" class="head">Range evidence</text>
  <text x="1560" y="910" text-anchor="middle" class="body">16 ordinal bins · relative NEAR / MID / FAR</text>

  <text x="950" y="1030" text-anchor="middle" class="subtitle">Static NCHW graph · A1-safe operators · one model_id · seven outputs</text>
</svg>
