<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">GrayNav unified monocular perception network</title>
  <desc id="desc">Research-style architecture diagram of the single-channel unified Indoor8 detection, surface segmentation, ordinal depth, and stair-edge network deployed on Flyingchip A1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#17202a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 31px Arial, Helvetica, sans-serif; fill: #17202a; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #566573; }
      .section { font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 0.7px; fill: #34495e; }
      .node-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #17202a; }
      .node { font: 400 15px Arial, Helvetica, sans-serif; fill: #2c3e50; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #566573; }
      .shape { font: 600 14px 'Courier New', monospace; fill: #1f618d; }
      .arrow { fill: none; stroke: #34495e; stroke-width: 2.2; marker-end: url(#arrow); }
      .skip { fill: none; stroke: #7f8c8d; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .panel { fill: #ffffff; stroke: #aeb6bf; stroke-width: 1.5; stroke-dasharray: 8 6; rx: 14; }
      .box { stroke-width: 1.5; rx: 10; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1800" height="980" fill="#ffffff"/>
  <text x="900" y="50" text-anchor="middle" class="title">GrayNav Unified Mono Perception Network</text>
  <text x="900" y="80" text-anchor="middle" class="subtitle">One Y8 input · one A1 INT8 model · one NPU inference · seven static outputs</text>

  <rect x="30" y="115" width="225" height="565" class="panel"/>
  <text x="48" y="145" class="section">INPUT</text>
  <rect x="57" y="205" width="170" height="118" class="box" fill="#eaf2f8" stroke="#5dade2"/>
  <text x="142" y="238" text-anchor="middle" class="node-title">SC132GS</text>
  <text x="142" y="265" text-anchor="middle" class="node">Mono Y8 frame</text>
  <text x="142" y="292" text-anchor="middle" class="shape">720 × 1280</text>
  <rect x="57" y="405" width="170" height="135" class="box" fill="#eaf2f8" stroke="#5dade2"/>
  <text x="142" y="438" text-anchor="middle" class="node-title">ROI + resize</text>
  <text x="142" y="465" text-anchor="middle" class="node">UPPER / LOWER</text>
  <text x="142" y="492" text-anchor="middle" class="node">true mono tensor</text>
  <text x="142" y="519" text-anchor="middle" class="shape">1 × 1 × 384 × 384</text>
  <path d="M142 323 L142 405" class="arrow"/>

  <rect x="280" y="115" width="745" height="565" class="panel"/>
  <text x="298" y="145" class="section">SHARED MONO-YOLOv8n BACKBONE AND PAN/FPN</text>
  <rect x="310" y="205" width="155" height="118" class="box" fill="#e8f8f5" stroke="#45b39d"/>
  <text x="388" y="238" text-anchor="middle" class="node-title">Gray stem</text>
  <text x="388" y="265" text-anchor="middle" class="node">Conv 3×3 / 2</text>
  <text x="388" y="292" text-anchor="middle" class="small">RGB weights summed</text>

  <rect x="510" y="185" width="220" height="158" class="box" fill="#e8f8f5" stroke="#45b39d"/>
  <text x="620" y="218" text-anchor="middle" class="node-title">C2f backbone</text>
  <text x="620" y="247" text-anchor="middle" class="node">Conv + C2f stages</text>
  <text x="620" y="274" text-anchor="middle" class="node">SPPF context</text>
  <text x="620" y="303" text-anchor="middle" class="shape">P3 / P4 / P5</text>
  <text x="620" y="327" text-anchor="middle" class="small">stride 8 / 16 / 32</text>

  <rect x="780" y="185" width="215" height="158" class="box" fill="#e8f8f5" stroke="#45b39d"/>
  <text x="888" y="218" text-anchor="middle" class="node-title">PAN/FPN neck</text>
  <text x="888" y="247" text-anchor="middle" class="node">Upsample + concat</text>
  <text x="888" y="274" text-anchor="middle" class="node">top-down / bottom-up</text>
  <text x="888" y="303" text-anchor="middle" class="shape">64 / 128 / 256 ch</text>
  <text x="888" y="327" text-anchor="middle" class="small">48² / 24² / 12²</text>
  <path d="M227 472 L310 264" class="arrow"/>
  <path d="M465 264 L510 264" class="arrow"/>
  <path d="M730 264 L780 264" class="arrow"/>

  <rect x="315" y="435" width="680" height="195" rx="12" fill="#f8f9f9" stroke="#ccd1d1" stroke-width="1.2"/>
  <text x="335" y="465" class="section">MULTI-SCALE FEATURES</text>
  <rect x="350" y="495" width="175" height="90" class="box" fill="#fef9e7" stroke="#f4d03f"/>
  <text x="438" y="527" text-anchor="middle" class="node-title">P3 detail</text>
  <text x="438" y="555" text-anchor="middle" class="shape">64 × 48 × 48</text>
  <rect x="565" y="495" width="175" height="90" class="box" fill="#fef9e7" stroke="#f4d03f"/>
  <text x="653" y="527" text-anchor="middle" class="node-title">P4 semantic</text>
  <text x="653" y="555" text-anchor="middle" class="shape">128 × 24 × 24</text>
  <rect x="780" y="495" width="175" height="90" class="box" fill="#fef9e7" stroke="#f4d03f"/>
  <text x="868" y="527" text-anchor="middle" class="node-title">P5 context</text>
  <text x="868" y="555" text-anchor="middle" class="shape">256 × 12 × 12</text>
  <path d="M888 343 L888 410 L438 410 L438 495" class="skip"/>
  <path d="M888 343 L888 430 L653 430 L653 495" class="skip"/>
  <path d="M888 343 L888 495" class="skip"/>

  <rect x="1050" y="115" width="720" height="565" class="panel"/>
  <text x="1068" y="145" class="section">TASK HEADS AND STATIC OUTPUT CONTRACT</text>

  <rect x="1080" y="185" width="290" height="200" class="box" fill="#f4ecf7" stroke="#a569bd"/>
  <text x="1225" y="218" text-anchor="middle" class="node-title">Indoor8 detection heads</text>
  <text x="1225" y="248" text-anchor="middle" class="node">COCO-row initialized classifiers</text>
  <text x="1225" y="274" text-anchor="middle" class="node">DFL regression, REG_MAX = 16</text>
  <text x="1225" y="307" text-anchor="middle" class="shape">cls: 8 × {48², 24², 12²}</text>
  <text x="1225" y="333" text-anchor="middle" class="shape">reg: 64 × {48², 24², 12²}</text>
  <text x="1225" y="362" text-anchor="middle" class="small">6 raw outputs · no NMS in graph</text>

  <rect x="1410" y="175" width="320" height="220" class="box" fill="#fdf2e9" stroke="#e67e22"/>
  <text x="1570" y="208" text-anchor="middle" class="node-title">Scene fusion branch</text>
  <text x="1570" y="239" text-anchor="middle" class="node">P3: 64→48→64</text>
  <text x="1570" y="265" text-anchor="middle" class="node">P4: 128→128→64 + NN upsample</text>
  <text x="1570" y="291" text-anchor="middle" class="node">Add + ReLU + depthwise separable 3×3</text>
  <text x="1570" y="326" text-anchor="middle" class="shape">4 seg + 16 depth + 1 edge</text>
  <text x="1570" y="354" text-anchor="middle" class="shape">scene_logits: 21 × 48 × 48</text>
  <text x="1570" y="380" text-anchor="middle" class="small">1 packed raw output</text>

  <path d="M955 540 L1040 540 L1040 285 L1080 285" class="arrow"/>
  <path d="M740 540 L1030 540 L1030 470 L1390 470 L1390 285 L1410 285" class="arrow"/>
  <path d="M525 540 L1015 540 L1015 450 L1380 450 L1380 255 L1410 255" class="arrow"/>

  <rect x="1080" y="455" width="650" height="175" rx="12" fill="#f8f9f9" stroke="#ccd1d1" stroke-width="1.2"/>
  <text x="1100" y="487" class="section">CPU POSTPROCESS INPUTS</text>
  <rect x="1110" y="515" width="270" height="80" class="box" fill="#f5eef8" stroke="#a569bd"/>
  <text x="1245" y="545" text-anchor="middle" class="node-title">Detection raw tensors</text>
  <text x="1245" y="572" text-anchor="middle" class="small">sigmoid · DFL · decode · NMS · tracker</text>
  <rect x="1425" y="515" width="270" height="80" class="box" fill="#fbeee6" stroke="#e67e22"/>
  <text x="1560" y="545" text-anchor="middle" class="node-title">Packed scene tensor</text>
  <text x="1560" y="572" text-anchor="middle" class="small">argmax · depth expectation · stair evidence</text>
  <path d="M1225 385 L1225 515" class="arrow"/>
  <path d="M1570 395 L1570 515" class="arrow"/>

  <rect x="30" y="725" width="1740" height="195" rx="14" fill="#fbfcfc" stroke="#aeb6bf" stroke-width="1.3"/>
  <text x="55" y="760" class="section">DEPLOYMENT SEMANTICS</text>
  <text x="65" y="802" class="node-title">Indoor8:</text>
  <text x="160" y="802" class="node">person · chair · dining_table · backpack · handbag · suitcase · couch · bench</text>
  <text x="65" y="842" class="node-title">Surface:</text>
  <text x="160" y="842" class="node">ground_candidate · blocked_surface · step_or_drop · unknown_other</text>
  <text x="65" y="882" class="node-title">Depth:</text>
  <text x="160" y="882" class="node">16 logarithmic ordinal bins over 0.3–8 m; converted to relative NEAR / MID / FAR / UNKNOWN evidence</text>

  <rect x="1225" y="790" width="25" height="18" fill="#e8f8f5" stroke="#45b39d"/>
  <text x="1260" y="804" class="small">shared network</text>
  <rect x="1390" y="790" width="25" height="18" fill="#f4ecf7" stroke="#a569bd"/>
  <text x="1425" y="804" class="small">detection</text>
  <rect x="1540" y="790" width="25" height="18" fill="#fdf2e9" stroke="#e67e22"/>
  <text x="1575" y="804" class="small">scene/depth</text>
  <text x="1735" y="902" text-anchor="end" class="small">GrayNav final unified architecture</text>
</svg>
